<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Plan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0px;
      color: #b10000;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .navbar h1 {
      color: #b10000;
      font-size: 28px;
      text-align: center;
    }
    .nav-links a {
      text-decoration: none;
      color: #b10000;
      margin: 0 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .container {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: space-between;
    }
    .left-panel, .right-panel {
      background: #fff;
      padding: 20px;
      margin: 30px;
      border-radius: 10px;
      border: 2px solid #b30000;
      flex: 1;
    }
    .left-panel {
      flex: 2;
      max-width: 60%;
    }
    .right-panel {
      flex: 1;
      max-width: 40%;
    }
    input, button {
      width: 80%;
      padding: 10px;
      margin: 5px 0;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    button {
      background: #b30000;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background: #9e0000;
    }
    .ingredient {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0;
      font-size: 14px;
    }
    .ingredient button {
      background: #ff6666;
      border: none;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
    }
    .meal-list div {
      background: #ffeaea;
      border: 1px solid #b30000;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>Meal Planner</h1>
    <div class="nav-links">
      <a href="home.html">HOME</a>
      <a href="blog_index.html">BLOG</a>
      <a href="plan.html">PLAN</a>
      <a href="expense.html">EXPENSE</a>
      <a href="recipe.html">RECIPE</a>
    </div>
  </div>

  <div class="container">
    <div class="left-panel">
      <h2>📅 Plan Your Meals</h2>
      <div>
        <label for="mealDate">Date:</label>
        <input type="date" id="mealDate" />
      </div>
      <div>
        <label for="mealType">Meal Type:</label>
        <select id="mealType">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
        </select>
      </div>
      <div>
        <label for="mealName">Meal Name:</label>
        <input type="text" id="mealName" placeholder="Meal Name" />
      </div>
      <button onclick="addMeal()">Add Meal</button>
      <h3>Meal List:</h3>
      <div id="mealList"></div>
    </div>

    <div class="right-panel">
      <h2>📅 Your Meals</h2>
      <div id="dailyMeals"></div>
    </div>
  </div>

  <div style="text-align: center; margin-bottom: 30px;">
    <button onclick="submitMeals()">Submit</button>
  </div>

  <script>
    const mealData = {};

    function addMeal() {
      const date = document.getElementById('mealDate').value;
      const type = document.getElementById('mealType').value;
      const name = document.getElementById('mealName').value;

      if (!date || !name) {
        alert('Please fill all fields');
        return;
      }

      if (!mealData[date]) {
        mealData[date] = [];
      }

      mealData[date].push({ type, name });
      renderMealList();
      renderDailyMeals();

      document.getElementById('mealName').value = '';
    }

    function renderMealList() {
      const mealList = document.getElementById('mealList');
      mealList.innerHTML = '';
      for (const date in mealData) {
        const div = document.createElement('div');
        div.innerHTML = `<h4>${date}</h4>
          <p>Meals: ${mealData[date].map(i => `${i.type} - ${i.name}`).join(', ')}</p>
          <button onclick="deleteMeal('${date}')">Delete All</button>`;
        mealList.appendChild(div);
      }
    }

    function deleteMeal(date) {
      delete mealData[date];
      renderMealList();
      renderDailyMeals();
    }

    function renderDailyMeals() {
      const dailyMeals = document.getElementById('dailyMeals');
      dailyMeals.innerHTML = '';
      for (const date in mealData) {
        const div = document.createElement('div');
        div.innerHTML = `<h4>${date}</h4>
          <p>Meals: ${mealData[date].map(i => `${i.type} - ${i.name}`).join(', ')}</p>`;
        dailyMeals.appendChild(div);
      }
    }

    function submitMeals() {
      for (const date in mealData) {
        mealData[date].forEach(item => {
          fetch('plan.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `date=${encodeURIComponent(date)}&mealtype=${encodeURIComponent(item.type)}&mealname=${encodeURIComponent(item.name)}`
          })
          .then(res => res.text())
          .then(data => console.log(data))
          .catch(err => console.error('Error:', err));
        });
      }
      alert('Meals submitted to database!');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    
</head>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
.container {
    position: relative;
    width: 400px;
    padding: 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
    text-align: center;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: url('pancake.img') no-repeat center center/cover;
}
.container h2 {
    margin-bottom: 20px;
    color: #900;
}
.input-box {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}
.btn {
    width: 70%;
    padding: 10px;
    background: #900;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
}
.btn:hover {
    background: #700;
}
.login-link {
    margin-top: 10px;
    font-size: 14px;
}
.login-link a {
    color: #900;
    text-decoration: none;
    font-weight: bold;
}
</style>
<body>
    <div class="container">
        <h2>Create New Account</h2>
        <form action="action.js" method="POST">
        <input type="text" class="input-box" placeholder="Name">
        <input type="email" class="input-box" placeholder="Email">
        <input type="password" class="input-box" placeholder="Password">
        <button href="home.html"  class="btn">Sign Up</button>
        </form>
        <p class="login-link">Already Registered? <a href="log_in.html">Login</a></p>
        <p class="login-link"><a href="home.html">home page</a></p>
    </div>
</body>
</html>

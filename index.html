<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }
        a {
  text-decoration: none;
}

        .container {
    display: flex;
    align-items: center; /* Ensures vertical alignment */
    justify-content: space-between; /* Spaces out the two sections */
    width: 900px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
}

.image-section {
    width: 50%; /* Makes image section take equal space */
    height: 100%;
}

.image-section img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures the image fills the section properly */
}

.content-section {
    width: 50%; /* Ensures equal width for text */
    text-align: center;
    padding: 30px;
}

        h2 {
            color: #900;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #900;
        }
        .btn {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            background: #900;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <img src="pancake.img" alt="Meal Planner Image">
        </div>
        <div class="content-section">
            <h2>Welcome to, <br><strong>Meal Planner</strong></h2>
            <p>What are you planning to do today?</p>
            <a href="blog_index.html" class="btn">BLOG</a>
            <a href="plan.html" class="btn">PLAN</a>
            <a href="expense.html" class="btn">EXPENSE</a>
            <a href="recipe.html" class="btn">RECIPE</a>
        </div>
    </div>
</body>
</html>
